---
- name: set locale to '{{ hardware_raspi_sys.locale }}'
  become: yes
  locale_gen:
    name: '{{ hardware_raspi_sys.locale }}'
    state: present

- name: set timezone to '{{ hardware_raspi_sys.timezone }}'
  become: yes
  timezone:
    name: '{{ hardware_raspi_sys.timezone }}'

- name: start & stop services
  become: yes
  service:
    name: '{{ item.name }}'
    enabled: '{{ item.enabled | default("yes") }}'
    state: '{{ item.state | default("started") }}'
  with_items: '{{ hardware_raspi_sys.services }}'
