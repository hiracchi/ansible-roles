---
- name: Create uptime-kuma directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ uptime_kuma_user }}"
    group: "{{ uptime_kuma_group }}"
    mode: "0755"
  loop:
    - "{{ uptime_kuma_dir }}"
    - "{{ uptime_kuma_dir }}/data"

- name: Deploy docker-compose.yml
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uptime_kuma_dir }}/docker-compose.yml"
    owner: "{{ uptime_kuma_user }}"
    group: "{{ uptime_kuma_group }}"
    mode: "0644"
  notify: Restart uptime-kuma

- name: Start uptime-kuma
  become: true
  become_user: "{{ uptime_kuma_user }}"
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ uptime_kuma_dir }}"
  register: uptime_kuma_up_result
  changed_when: >
    'Started' in uptime_kuma_up_result.stdout or
    'Created' in uptime_kuma_up_result.stdout or
    'Recreated' in uptime_kuma_up_result.stdout or
    'Started' in uptime_kuma_up_result.stderr or
    'Created' in uptime_kuma_up_result.stderr or
    'Recreated' in uptime_kuma_up_result.stderr
