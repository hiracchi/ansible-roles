slurmctld_hosts:
  - jarvis-control-01

slurm_cluster_name: cluster
slurm_gres_types: ""
slurm_gres_conf: []

slurm_nodes:
  - "jarvis-prxvm-worker-z3-[01-03] CPUs=2 State=UNKNOWN"

slurm_preempt_type: ""
slurm_preempt_mode: ""
slurm_preempt_exempt_time: ""

slurm_partitions:
  - "debug Nodes=jarvis-prxvm-worker-z3-[01-03] MaxTime=120 State=UP Default=YES"

# slurm.conf の PropagateResourceLimitsExcept(例: "MEMLOCK")。空なら設定しない。
# 投入側のシェルの上限を引き継がず、slurmd の上限をジョブに使わせたい項目を指定する
slurm_propagate_resource_limits_except: ""

# slurmd の systemd drop-in で設定する LimitMEMLOCK(例: "infinity")。
# 空なら drop-in を置かない(既に置いてあれば削除する)
slurm_slurmd_limit_memlock: ""
