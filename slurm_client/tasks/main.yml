---
- name: add slurm group
  become: yes
  ansible.builtin.group:
    name: slurm
    gid: 64030
    system: yes

- name: add slurm user
  become: yes
  ansible.builtin.user:
    name: slurm
    uid: 64030
    group: slurm
    state: present
    system: yes
    home: /nonexistent
    shell: /usr/sbin/nologin

- name: install slurm client packages
  become: yes
  ansible.builtin.apt:
    name:
      - slurmd
      - slurm-client
    state: present

- name: make /etc/slurm
  become: yes
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    mode: '0755'
    owner: slurm
    group: slurm

- name: make spool dir for slurm
  become: yes
  ansible.builtin.file:
    path: /var/spool/slurmd.spool
    state: directory
    mode: '0755'
    owner: slurm
    group: slurm

- name: make spool dir for slurm state
  become: yes
  ansible.builtin.file:
    path: /var/spool/slurm.state
    state: directory
    mode: '0755'
    owner: slurm
    group: slurm

- name: setup slurm.conf
  become: yes
  ansible.builtin.template:
    src: slurm.conf.tmpl
    dest: /etc/slurm/slurm.conf
    mode: '0644'
    owner: slurm
    group: slurm
  notify:
    - restart slurmd

- name: copy cgroup file
  become: yes
  ansible.builtin.copy:
    src: cgroup.conf
    dest: /etc/slurm/cgroup.conf
    mode: '0644'
    owner: slurm
    group: slurm
  notify:
    - restart slurmd

- name: setup gres.conf
  become: yes
  ansible.builtin.template:
    src: gres.conf.j2
    dest: /etc/slurm/gres.conf
    mode: '0644'
    owner: slurm
    group: slurm
  when: slurm_gres_conf is defined and slurm_gres_conf | length > 0
  notify:
    - restart slurmd

# slurmd の上限をパッケージのユニット任せにせず明示する。PropagateResourceLimitsExcept で
# 投入側の上限を引き継がない項目は、ジョブが slurmd の上限をそのまま使うため
- name: Make slurmd systemd drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/slurmd.service.d
    state: directory
    mode: '0755'
    owner: root
    group: root
  when: slurm_slurmd_limit_memlock | length > 0

- name: Setup slurmd LimitMEMLOCK drop-in
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/slurmd.service.d/limits.conf
    content: |
      # Managed by Ansible (slurm_client)
      [Service]
      LimitMEMLOCK={{ slurm_slurmd_limit_memlock }}
    mode: '0644'
    owner: root
    group: root
  when: slurm_slurmd_limit_memlock | length > 0
  notify:
    - Reload systemd
    - restart slurmd

- name: Remove slurmd LimitMEMLOCK drop-in when not configured
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/slurmd.service.d/limits.conf
    state: absent
  when: slurm_slurmd_limit_memlock | length == 0
  notify:
    - Reload systemd
    - restart slurmd

- name: start and enable slurmd
  become: yes
  ansible.builtin.service:
    name: slurmd
    state: started
    enabled: yes
