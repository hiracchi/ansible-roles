---
plg_monitoring_dir: "/opt/plg-monitoring"
plg_monitoring_user: "{{ ansible_user | default('ubuntu') }}"
plg_monitoring_group: "{{ plg_monitoring_user }}"
plg_monitoring_uid: 1000
plg_monitoring_gid: 1000

plg_monitoring_grafana_port: 3000
plg_monitoring_prometheus_port: 9090
plg_monitoring_loki_port: 3100

plg_monitoring_grafana_admin_user: "admin"
plg_monitoring_grafana_admin_password: "admin"

# クラスタ表示名 (ダッシュボードタイトル等に使用)
plg_monitoring_cluster_name: "JARVIS"

# データ保持期間 (Retention)
plg_monitoring_prometheus_retention: "30d"
plg_monitoring_loki_retention: "720h"

# SMTP (メール送信 / Gmail連携) 設定
plg_monitoring_smtp_enabled: false
plg_monitoring_smtp_host: "smtp.gmail.com:587"
plg_monitoring_smtp_user: ""
plg_monitoring_smtp_password: ""
plg_monitoring_smtp_from_address: ""
plg_monitoring_smtp_from_name: "{{ plg_monitoring_cluster_name }} Cluster Alerts"

# アラート機能 & 通知先設定
plg_monitoring_alerts_enabled: false
plg_monitoring_alert_receivers: []
plg_monitoring_alert_host_down_for: "2m"
plg_monitoring_alert_disk_threshold_percent: 10
plg_monitoring_alert_cpu_threshold_percent: 90
plg_monitoring_alert_cpu_enabled: true
plg_monitoring_alert_cpu_for: "5m"
# CPU 高負荷アラートの対象外とする instance ラベル (正規表現として "|" で連結される)
plg_monitoring_alert_cpu_exclude_instances: []
