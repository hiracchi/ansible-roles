# {{ nis_securentes_netmask }}         {{ nis_securenets_network }}
# nis_domainname
# nis_servername
---
- name: setup nis role
  become: yes
  lineinfile:
    dest: /etc/default/nis
    regexp: "^NISSERVER=*"
    line: "NISSERVER=master"
  notify: restart nis server


# the NIS maps (/var/yp/<domain>/passwd.byname) exist only after `ypinit -m`
- name: find NIS maps
  ansible.builtin.find:
    paths: "/var/yp/{{ nis_domainname }}"
    patterns: "passwd.byname*"
  register: nis_passwd_map


- name: add NIS group
  become: yes
  group:
    name: "{{ item.key }}"
    gid: "{{ item.value.gid }}"
    state: present
  with_dict: "{{ nis_groups | default({}) }}"
  notify: rebuild nis maps

 
- name: add NIS users
  become: yes
  user:
    name: "{{ item.key }}"
    groups: "{{ item.value.groups | default('') }}"
    group: "{{ item.value.group }}"
    state: present
    uid: "{{ item.value.uid }}"
    home: "{{ item.value.home }}"
    shell: "{{ item.value.shell | default('/bin/bash') }}"
    createhome: "{{ item.value.createhome | default(false) | bool }}"
  with_dict: "{{ nis_users | default({}) }}"
  notify: rebuild nis maps


# nis_users.<name>.ssh_keys (list of public keys) is optional.
# The home directory must exist (set createhome: true or provide it by NFS etc.).
- name: add authorized_keys for NIS users
  become: yes
  ansible.posix.authorized_key:
    user: "{{ item.0.key }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ nis_users | default({}) | dict2items | subelements('value.ssh_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.key }}"

 
- name: update NIS user password
  become: yes
  user:
    name: "{{ item.key }}"
    # salt is seeded by the user name so that the same password gives the same
    # hash (otherwise the task is "changed" on every run)
    password: "{{ item.value.password | password_hash('sha512', 65534 | random(seed=item.key) | string) }}"
  when:
    - item.value.password is defined
    - item.value.update_password is defined
    - item.value.update_password
    - nis_task == "master"
  with_dict: "{{ nis_users | default({}) }}"
  notify: rebuild nis maps


# `ypinit -m` is interactive: it reads the list of slave servers from stdin until
# EOF and then asks for a confirmation (an empty answer means yes). It is run with
# stdin from /dev/null, and only when no map exists yet. It is done after the users
# and groups are created because the maps are built from the local passwd/group files.
- name: set domainname of the running system
  become: yes
  ansible.builtin.command: "domainname {{ nis_domainname }}"
  changed_when: false
  when:
    - nis_initialize | bool
    - nis_passwd_map.matched == 0


- name: initialize nis database for master
  become: yes
  ansible.builtin.shell: /usr/lib/yp/ypinit -m < /dev/null
  changed_when: true
  notify: restart nis server
  when:
    - nis_initialize | bool
    - nis_passwd_map.matched == 0


# ypinit exits with 0 even if building the maps failed
- name: check NIS maps were created
  ansible.builtin.find:
    paths: "/var/yp/{{ nis_domainname }}"
    patterns: "passwd.byname*"
  register: nis_passwd_map_created
  failed_when: nis_passwd_map_created.matched == 0
  when:
    - nis_initialize | bool
    - nis_passwd_map.matched == 0
