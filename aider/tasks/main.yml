---
- name: Install prerequisite packages for Aider
  become: true
  ansible.builtin.apt:
    pkg:
      - curl
      - git
    state: present

- name: Check if aider binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/aider
  register: aider_bin_stat

- name: Remove broken /opt/aider if aider was not installed
  become: true
  ansible.builtin.file:
    path: /opt/aider
    state: absent
  when: not aider_bin_stat.stat.exists

- name: Create /opt/aider directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /opt/aider
    - /opt/aider/tools
    - /opt/aider/python

- name: Install uv if not present
  become: true
  ansible.builtin.shell: |
    curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  args:
    creates: /usr/local/bin/uv

- name: Install Aider via uv tool with isolated Python 3.12
  become: true
  ansible.builtin.command:
    cmd: >-
      env UV_TOOL_DIR=/opt/aider/tools
      UV_TOOL_BIN_DIR=/usr/local/bin
      UV_PYTHON_INSTALL_DIR=/opt/aider/python
      /usr/local/bin/uv tool install --force --python 3.12 aider-chat
    creates: /usr/local/bin/aider

- name: Deploy default environment variables for Aider (profile.d)
  become: true
  ansible.builtin.template:
    src: aider.sh.j2
    dest: /etc/profile.d/aider.sh
    owner: root
    group: root
    mode: '0644'
  when: aider_setup_profile | bool

- name: Remove profile.d environment variables for Aider if disabled
  become: true
  ansible.builtin.file:
    path: /etc/profile.d/aider.sh
    state: absent
  when: not (aider_setup_profile | bool)

- name: Setup Environment Modules modulefile for Aider
  when: aider_setup_modulefile | bool
  block:
    - name: Ensure modulefile directory exists for Aider
      become: true
      ansible.builtin.file:
        path: "{{ aider_modulefile_dir }}/{{ aider_module_name }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy Environment Modules modulefile for Aider
      become: true
      ansible.builtin.template:
        src: aider.modulefile.j2
        dest: "{{ aider_modulefile_dir }}/{{ aider_module_name }}/{{ aider_module_version }}"
        owner: root
        group: root
        mode: '0644'

    - name: Create default symlink for Aider modulefile
      become: true
      ansible.builtin.file:
        src: "{{ aider_module_version }}"
        dest: "{{ aider_modulefile_dir }}/{{ aider_module_name }}/default"
        state: link
        owner: root
        group: root
