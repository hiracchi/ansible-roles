---
- name: Create promtail group
  ansible.builtin.group:
    name: "{{ promtail_group }}"
    state: present

- name: Create promtail user
  ansible.builtin.user:
    name: "{{ promtail_user }}"
    group: "{{ promtail_group }}"
    groups: adm,systemd-journal
    append: true
    shell: /sbin/nologin
    system: true
    create_home: false
    state: present

- name: Ensure unzip package is installed
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Download and unzip promtail binary
  ansible.builtin.unarchive:
    src: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/promtail-linux-amd64

- name: Copy promtail binary to /usr/local/bin/promtail
  ansible.builtin.copy:
    src: /usr/local/bin/promtail-linux-amd64
    dest: /usr/local/bin/promtail
    owner: root
    group: root
    mode: '0755'
    remote_src: true

- name: Create promtail config directory
  ansible.builtin.file:
    path: /etc/promtail
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create promtail configuration file
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: /etc/promtail/config.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart promtail

- name: Create promtail systemd service
  ansible.builtin.template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart promtail

- name: Ensure promtail is enabled and started
  ansible.builtin.systemd:
    name: promtail
    enabled: true
    state: started
    daemon_reload: true
