---
- name: update users
  become: yes
  ansible.builtin.user:
    name: "{{ item.user }}"
    uid: "{{ item.uid }}"
    group: "{{ item.group }}"
    groups: "{{ item.groups }}"
    # 指定したグループを追加するだけにし、他ロール(docker など)が入れた所属を消さない
    append: true
    home: "{{ item.home | default(omit) }}"
    password: "{{ item.password }}"
    # password: "{{ item.value.password | password_hash('sha512') }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    createhome: "{{ item.createhome | default('no') }}"
    state: present
  with_items: "{{ system_users_list }}"
  # ignore_errors: yes
