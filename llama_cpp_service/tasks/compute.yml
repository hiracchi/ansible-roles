---
- name: Create local directories on compute node
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ llama_cpp_user }}"
    group: "{{ llama_cpp_group }}"
    mode: '0755'
  loop:
    - "{{ llama_cpp_scripts_dir }}"
    - "{{ llama_cpp_log_dir }}"

- name: Deploy llama.cpp cluster Slurm service script
  become: true
  ansible.builtin.template:
    src: llama-cpp-cluster.sh.j2
    dest: "{{ llama_cpp_scripts_dir }}/llama-cpp-cluster.sh"
    owner: "{{ llama_cpp_user }}"
    group: "{{ llama_cpp_group }}"
    mode: '0755'

- name: Allow sudo group to run shutdown commands without password on compute nodes
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-compute-shutdown
    content: "%sudo ALL=(ALL) NOPASSWD: /usr/sbin/shutdown, /usr/sbin/poweroff, /usr/sbin/reboot\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
