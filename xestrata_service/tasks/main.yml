---
# Slurm のコントローラ(sbatch を実行できるホスト)に適用する。
# イメージのビルドだけは、apptainer が入った計算ノード(xestrata_build_host)で行う。
- name: Validate xestrata_state
  ansible.builtin.assert:
    that:
      - xestrata_state in ['present', 'absent']
    fail_msg: "xestrata_state は present か absent を指定してください"

- name: Install and run XeStrata
  ansible.builtin.include_tasks: present.yml
  when: xestrata_state == 'present'

- name: Remove XeStrata
  ansible.builtin.include_tasks: absent.yml
  when: xestrata_state == 'absent'
