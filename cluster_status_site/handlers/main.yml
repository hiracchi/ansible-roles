---
- name: Start cluster status site
  become: true
  ansible.builtin.command:
    cmd: "docker compose -f {{ cluster_status_site_dir }}/compose.yaml up -d"
  changed_when: true

- name: Recreate cluster status site
  become: true
  ansible.builtin.command:
    cmd: "docker compose -f {{ cluster_status_site_dir }}/compose.yaml up -d --force-recreate"
  changed_when: true
