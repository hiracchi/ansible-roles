---
- name: add munge group
  become: yes
  ansible.builtin.group:
    name: munge
    gid: "{{ munge_gid }}"
    system: yes

- name: add munge user
  become: yes
  ansible.builtin.user:
    name: munge
    uid: "{{ munge_uid }}"
    group: munge
    state: present
    system: yes
    home: /nonexistent
    shell: /usr/sbin/nologin

- name: install munge
  become: yes
  ansible.builtin.apt:
    pkg:
      - munge
    state: present

- name: Ensure secrets directory exists on controller
  ansible.builtin.file:
    path: "{{ munge_key_file | dirname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  run_once: true

- name: Generate munge.key on ansible controller if not present
  ansible.builtin.shell: |
    if [ ! -f "{{ munge_key_file }}" ]; then
      dd if=/dev/urandom of="{{ munge_key_file }}" bs=1 count=1024
      chmod 600 "{{ munge_key_file }}"
    fi
  delegate_to: localhost
  run_once: true
  register: key_generation
  changed_when: "'records out' in key_generation.stderr"

- name: Copy munge.key to target hosts
  become: yes
  ansible.builtin.copy:
    src: "{{ munge_key_file }}"
    dest: /etc/munge/munge.key
    mode: '0400'
    owner: munge
    group: munge
  notify: restart munge

- name: Start and enable munge service
  become: yes
  ansible.builtin.service:
    name: munge
    state: started
    enabled: yes
