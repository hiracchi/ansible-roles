---
- name: Disable systemd-timesyncd to prevent conflicts
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  failed_when: false
  when: chrony_disable_timesyncd | bool

- name: Install chrony package
  ansible.builtin.package:
    name: "{{ chrony_package_name }}"
    state: present
  when: chrony_manage_package | bool

# Auto-detect service name for Debian/Ubuntu if default 'chronyd' is used
- name: Set OS-specific service name for Debian family
  ansible.builtin.set_fact:
    chrony_service_name: chrony
  when:
    - chrony_service_name == 'chronyd'
    - ansible_facts['os_family'] | default('') == 'Debian'

# Decide where to place the generated configuration.
# Prefer fragment dir (/etc/chrony/conf.d) when present,
# otherwise fall back to the main config file.
- name: Check for /etc/chrony/conf.d
  ansible.builtin.stat:
    path: /etc/chrony/conf.d
  register: chrony_conf_d_dir

- name: Check for /etc/chrony/chrony.conf
  ansible.builtin.stat:
    path: /etc/chrony/chrony.conf
  register: chrony_main_conf

- name: Check for /etc/chrony.conf
  ansible.builtin.stat:
    path: /etc/chrony.conf
  register: chrony_root_conf

- name: Set chrony_conf_dest to conf.d fragment when available
  ansible.builtin.set_fact:
    chrony_conf_dest: "/etc/chrony/conf.d/{{ chrony_conf_d_filename }}"
  when:
    - chrony_conf_dest == '/etc/chrony.conf'
    - chrony_conf_d_dir.stat.exists

- name: Prefer /etc/chrony/chrony.conf if that exists and no conf.d
  ansible.builtin.set_fact:
    chrony_conf_dest: /etc/chrony/chrony.conf
  when:
    - chrony_conf_dest == '/etc/chrony.conf'
    - chrony_main_conf.stat.exists

- name: Fallback to /etc/chrony.conf if nothing else found
  ansible.builtin.set_fact:
    chrony_conf_dest: /etc/chrony.conf
  when: chrony_conf_dest is not defined

- name: Ensure chrony configuration directory exists
  ansible.builtin.file:
    path: "{{ chrony_conf_dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: "(chrony_conf_dest | dirname) != '/'"

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ chrony_conf_dest }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart chrony

- name: Ensure chrony service is enabled and running
  ansible.builtin.service:
    name: "{{ chrony_service_name }}"
    state: started
    enabled: true

