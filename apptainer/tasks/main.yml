---
- name: Install prerequisite packages for Apptainer
  become: true
  ansible.builtin.apt:
    name:
      - software-properties-common
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Download Apptainer PPA signing key
  become: true
  ansible.builtin.get_url:
    url: "{{ apptainer_ppa_key_url }}"
    dest: "/tmp/apptainer-keyring.asc"
    mode: "0644"

- name: Dearmor Apptainer PPA signing key
  become: true
  ansible.builtin.command:
    cmd: "gpg --yes --dearmor -o /usr/share/keyrings/apptainer-keyring.gpg /tmp/apptainer-keyring.asc"
    creates: "/usr/share/keyrings/apptainer-keyring.gpg"

- name: Remove temporary Apptainer armored key
  become: true
  ansible.builtin.file:
    path: "/tmp/apptainer-keyring.asc"
    state: absent

- name: Add Apptainer APT repository
  become: true
  ansible.builtin.copy:
    content: |
      deb [signed-by=/usr/share/keyrings/apptainer-keyring.gpg] https://ppa.launchpadcontent.net/apptainer/ppa/ubuntu {{ apptainer_ppa_suite }} main
    dest: "/etc/apt/sources.list.d/apptainer.list"
    owner: root
    group: root
    mode: "0644"

- name: Install Apptainer
  become: true
  ansible.builtin.apt:
    name: apptainer
    state: present
    update_cache: true

- name: Install Apptainer SUID (optional)
  become: true
  ansible.builtin.apt:
    name: apptainer-suid
    state: present
  when: apptainer_install_suid | bool
