ntp_servers:
  - 0.ubuntu.pool.ntp.org
  - 1.ubuntu.pool.ntp.org
  - 2.ubuntu.pool.ntp.org
  - 3.ubuntu.pool.ntp.org

limits:
  - domain: '#*'
    type: 'hard'
    item: memlock
    value: 3145728
  - domain: '#*'
    type: 'soft'
    item: memlock
    value: 3145728

# unattended-upgrades
ubuntu_base_enable_unattended_upgrades: true
ubuntu_base_unattended_upgrades_update_package_lists: "1"
ubuntu_base_unattended_upgrades_unattended_upgrade: "1"
