---
- name: Ensure sshd_config includes /etc/ssh/sshd_config.d/*.conf
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^[#\s]*Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertafter: BOF
    validate: "/usr/sbin/sshd -t -f %s"

- name: Configure sshd hardening via drop-in configuration
  become: true
  ansible.builtin.template:
    src: 00-ansible-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: reload sshd
