---
- name: Ensure orca installation directory exists
  ansible.builtin.file:
    path: "{{ orca_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Orca AppImage binary
  ansible.builtin.get_url:
    url: "{{ orca_appimage_url }}"
    dest: "{{ orca_install_dir }}/{{ orca_bin_name }}"
    owner: root
    group: root
    mode: '0755'
  notify: Restart orca-serve

- name: Install orca-pairing-info helper script
  become: true
  ansible.builtin.copy:
    src: orca-pairing-info
    dest: /usr/local/bin/orca-pairing-info
    owner: root
    group: root
    mode: '0755'

- name: Install orca-uninstall helper script
  become: true
  ansible.builtin.copy:
    src: orca-uninstall
    dest: /usr/local/bin/orca-uninstall
    owner: root
    group: root
    mode: '0755'


