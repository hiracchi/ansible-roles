---
# tasks/device-binding.yml - GPU device binding to VFIO

- name: Include GPU information tasks
  include_tasks: gpu-info.yml

- name: Create VFIO device binding script
  become: yes
  template:
    src: vfio-bind.sh.j2
    dest: /usr/local/bin/vfio-bind.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - vfio-bind

- name: Display device binding information
  debug:
    msg: |
      To bind GPU device {{ gpu_bdf.stdout }} to VFIO:
      1. Get the device ID: lspci -nn -s {{ gpu_bdf.stdout }}
      2. Extract the vendor and device ID (format: [vendor:device])
      3. Add to modprobe configuration or use: echo "vendor device" > /sys/bus/pci/drivers/vfio-pci/new_id
      
      Example:
      echo "1002 731f" > /sys/bus/pci/drivers/vfio-pci/new_id
  when: gpu_bdf.stdout | length > 0

- name: Display VFIO binding helper
  debug:
    msg: |
      Helper scripts available:
      - /usr/local/bin/vfio-bind.sh - Manual GPU binding to VFIO
      
      Usage examples:
      1. Unbind GPU from current driver:
         echo {{ gpu_bdf.stdout }} > /sys/bus/pci/devices/0000:{{ gpu_bdf.stdout }}/driver/unbind
      
      2. Bind to VFIO:
         echo vendor device > /sys/bus/pci/drivers/vfio-pci/new_id
      
      3. Verify binding:
         lspci -k -s {{ gpu_bdf.stdout }}
